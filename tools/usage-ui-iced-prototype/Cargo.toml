[package]
name = "usage-ui-iced-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
codex-usage-core = { path = "../../crates/core" }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "advanced-shaping", "image-without-codecs", "thread-pool", "tiny-skia"] }
# Keep Iced's bundled image decoder limited to the JPEG format used by the backdrop.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lucide-icons = { version = "1.48.0", features = ["iced"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tray-icon = { version = "0.25.1", default-features = false }

[target.'cfg(windows)'.dependencies]
codex-usage-windows-auth = { path = "../../crates/windows-auth" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
