[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/desktop",
    "apps/login",
    "crates/core",
    "crates/platform-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Workspace crates
usage-monitor-core = { path = "crates/core" }
usage-monitor-windows = { path = "crates/platform-windows" }

# Third-party crates, versioned once for the whole workspace
async-channel = "2.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "advanced-shaping", "image-without-codecs", "thread-pool", "tiny-skia"] }
# Keep image decoding limited to the JPEG and PNG assets the desktop app ships.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lucide-icons = { version = "1.48.0", features = ["iced"] }
portable-pty = "0.9"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tray-icon = { version = "0.25.1", default-features = false }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = "0.61"
